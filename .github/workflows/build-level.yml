name: Build Level

on:
  workflow_dispatch:
  push:
    paths:
      - "level.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exopython
        run: pip install exopython

      - name: Run level.py
        run: python level.py

      - name: Upload output.py artifact
        uses: actions/upload-artifact@v7
        with:
          name: output-py
          path: output.py
          if-no-files-found: error
