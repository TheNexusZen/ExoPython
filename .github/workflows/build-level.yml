name: Build Level

on:
  workflow_dispatch:
  push:
    paths:
      - "level.py"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exopython
        run: pip install exopython

      - name: Patch missing now_cs_ticks in exopython.binary
        run: |
          python - <<'EOF'
          import pathlib, exopython.binary as b

          path = pathlib.Path(b.__file__)
          src = path.read_text(encoding="utf-8")
          if "def now_cs_ticks" not in src:
              patch = """

          def now_cs_ticks() -> int:
              import datetime
              epoch = datetime.datetime(1970, 1, 1, tzinfo=datetime.timezone.utc)
              now = datetime.datetime.now(datetime.timezone.utc)
              delta_us = int((now - epoch).total_seconds() * 1_000_000)
              return 621355968000000000 + delta_us * 10
          """
              path.write_text(src + patch, encoding="utf-8")
          EOF
          python -c "import exopython as exo; print('exopython imported OK')"

      - name: Run level.py
        run: python level.py

      - name: Upload output.py artifact
        uses: actions/upload-artifact@v7
        with:
          name: output-py
          path: output.py
          if-no-files-found: error
