[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exopython"
version = "1.0.0"
description = "Programmatic level builder, decompiler, and obfuscator for Exoracer (.exolvl)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
include = ["exopy*"]

[project.urls]
Homepage = "https://github.com/TheNexusZen/ExoPython"
Repository = "https://github.com/TheNexusZen/ExoPython"
