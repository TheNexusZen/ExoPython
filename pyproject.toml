[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exopython"
version = "1.1.5"
description = "level builder, decompiler, image converter, and obfuscator for Exoracer (.exolvl) in python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9.0.0"]

[tool.setuptools]
packages = ["exopython"]

[tool.setuptools.package-dir]
exopython = "exopy"

[project.urls]
Homepage = "https://github.com/TheNexusZen/ExoPython"
Repository = "https://github.com/TheNexusZen/ExoPython"
