[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exopython"
version = "1.1.1"
description = "level builder, decompiler, image converter, and obfuscator for Exoracer (.exolvl) in python"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
image = ["Pillow>=9.0.0"]

[tool.setuptools.packages.find]
include = ["exopy*", "exopython*"]

[project.urls]
Homepage = "https://github.com/TheNexusZen/ExoPython"
Repository = "https://github.com/TheNexusZen/ExoPython"
